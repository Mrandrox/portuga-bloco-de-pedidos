"name: Portuga \u2014 aplicativo Windows\n\non:\n  push:\n    branches: [main]\n    paths:\n      - \"windows-app/**\"\n      - \"bloco-de-notas-android/www/**\"\n      - \".github/workflows/windows-app.yml\"\n  pull_request:\n    branches: [main]\n    paths:\n      - \"windows-app/**\"\n      - \"bloco-de-notas-android/www/**\"\n      - \".github/workflows/windows-app.yml\"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  build:\n    runs-on: windows-latest\n    defaults:\n      run:\n        working-directory: windows-app\n\n    steps:\n      - name: Baixar o c\u00f3digo\n        uses: actions/checkout@v5\n\n      - name: Preparar Node.js\n        uses: actions/setup-node@v5\n        with:\n          node-version: 22\n          cache: npm\n          cache-dependency-path: windows-app/package-lock.json\n\n      - name: Instalar depend\u00eancias\n        run: npm ci --no-audit --no-fund\n\n      - name: Conferir arquivos do aplicativo\n        run: npm run check\n\n      - name: Gerar instalador Windows x64\n        run: npm run dist:win\n\n      - name: Guardar instalador para revis\u00e3o\n        uses: actions/upload-artifact@v4\n        with:\n          name: Portuga-Bloco-de-Pedidos-Windows\n          path: windows-app/dist/Portuga-Bloco-de-Pedidos-Setup.exe\n          if-no-files-found: error\n          retention-days: 30\n"