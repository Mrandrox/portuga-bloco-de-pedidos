name: Portuga — Bloco de Pedidos Android APK
# Release APK 1.0.12

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloco-de-notas-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Validate native build script
        run: bash -n ./aplicar-impressora-android.sh

      - name: Apply Bluetooth printer bridge and shell
        run: bash ./aplicar-impressora-android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portuga-bloco-de-pedidos-android
          path: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12
          target_commitish: ${{ github.sha }}
          name: Portuga Bloco de Pedidos v1.0.12
          body: |
            Shell Android isolado com recuperação robusta do WebView.
            - usa o HTML original como conteúdo local do app, sem depender do Chrome para iniciar a interface;
            - mantém HTTPS + localhost, configuração oficial do servidor local do Capacitor;
            - adiciona retry automático para ERR_NAME_NOT_RESOLVED/host lookup, connection e timeout transitórios do localhost;
            - mantém a camada nativa de recuperação com tentar novamente, Chrome, atualização do WebView e diagnóstico;
            - mantém a ponte Bluetooth ESC/POS para POS-58;
            - registra o plugin nativo PortugaShell para saídas seguras do app;
            - aumenta a tolerância de inicialização para aparelhos Android mais lentos;
            - valida o script nativo antes da compilação.
          files: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
