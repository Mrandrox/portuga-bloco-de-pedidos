name: Portuga — Bloco de Pedidos Android APK
# Release APK 1.0.13

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloco-de-notas-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Validate native build script
        run: bash -n ./aplicar-impressora-android.sh

      - name: Apply Bluetooth printer bridge and shell
        run: bash ./aplicar-impressora-android.sh

      - name: Inject menu category and persistent client tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("www/index.html")
          js = Path("www/menu-clientes.js").read_text(encoding="utf-8")
          src = html.read_text(encoding="utf-8")
          marker = "</body>"
          if "portuga-client-tabs" not in src:
              src = src.replace(marker, '<script>\n' + js + '\n</script>\n' + marker, 1)
          html.write_text(src, encoding="utf-8")
          print("Recursos de categorias/clientes injetados no app.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portuga-bloco-de-pedidos-android-1.0.13
          path: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          target_commitish: ${{ github.sha }}
          name: Portuga Bloco de Pedidos v1.0.13
          body: |
            Atualização do Bloco de Pedidos Android.
            - abas de Lanches, Petiscos, Pizzas e Bebidas no construtor do pedido;
            - abas persistentes por cliente/comanda;
            - vários pedidos podem ser lançados para o mesmo cliente sem criar uma nova aba;
            - dados das abas ficam no armazenamento local do aparelho;
            - mantém a ponte Bluetooth ESC/POS para POS-58;
            - mantém o ambiente Android baseado em WebView/Chromium e o fluxo existente do cardápio.
          files: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
