name: Portuga — Bloco de Pedidos Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloco-de-notas-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply Bluetooth printer bridge
        run: bash ./aplicar-impressora-android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portuga-bloco-de-pedidos-android
          path: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          target_commitish: ${{ github.sha }}
          name: Portuga Bloco de Pedidos v1.0.10
          body: |
            Correção de compatibilidade WebView/Chrome.
            - troca o hostname local de localhost para 127.0.0.1 para evitar falha de resolução DNS do loopback;
            - usa HTTP local para máxima compatibilidade com WebViews antigos;
            - mantém a interface HTML atual;
            - mantém a ponte Bluetooth ESC/POS para POS-58;
            - usa SystemBars em modo nativo para compatibilidade Android moderno.
          files: bloco-de-notas-android/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
