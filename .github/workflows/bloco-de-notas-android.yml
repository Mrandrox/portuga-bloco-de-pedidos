name: Portuga — Bloco de Pedidos Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloco-de-notas-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Aplicar camada Android
        run: |
          bash -n ./aplicar-impressora-android.sh
          bash ./aplicar-impressora-android.sh

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar código
        run: |
          test -f android/app/src/main/java/com/blocodenotas/app/MainActivity.java
          test -f android/app/src/main/java/com/blocodenotas/app/BluetoothPrinterPlugin.java
          test -f android/app/src/main/java/com/blocodenotas/app/PortugaShellPlugin.java
          node --check www/menu-clientes.js

      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Preparar arquivo para download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Portuga-Bloco-de-Pedidos.apk
          ls -lh Portuga-Bloco-de-Pedidos.apk

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: Portuga-Bloco-de-Pedidos
          path: bloco-de-notas-android/Portuga-Bloco-de-Pedidos.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Portuga — Bloco de Pedidos v1.1.${{ github.run_number }}
          body: |
            APK instalável do Portuga — Bloco de Pedidos.

            - comanda contínua por cliente;
            - subtotal individual por cliente;
            - Lanches, Petiscos, Pizzas e Bebidas;
            - Bluetooth Classic/SPP nativo para POS-58;
            - reconexão automática da impressora;
            - logo do projeto usada no ícone do aplicativo.

            Download direto:
            https://github.com/Mrandrox/portuga-bloco-de-pedidos/releases/latest/download/Portuga-Bloco-de-Pedidos.apk
          files: bloco-de-notas-android/Portuga-Bloco-de-Pedidos.apk
          generate_release_notes: true
          make_latest: true