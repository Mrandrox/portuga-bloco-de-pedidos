name: Portuga — Comanda Única Android

on:
  workflow_dispatch:
  push:
    paths:
      - "comanda-unica-android/**"
      - ".github/workflows/comanda-unica-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comanda-unica-android

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: comanda-unica-android/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK instalável
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: portuga-comanda-unica-debug
          path: comanda-unica-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preparar versão pública
        id: version
        shell: bash
        run: echo "tag=comanda-unica-v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publicar APK para download público
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Portuga — Comanda Única ${{ steps.version.outputs.tag }}
          body: |
            APK instalável do Portuga — Comanda Única.

            - Um cliente por comanda.
            - Uma única comanda contínua.
            - Cardápio separado em Lanches, Bebidas, Petiscos e Combos.
            - Interface otimizada para Android.

            Instalação: baixe o arquivo APK no Android e abra-o. Se o Android solicitar, permita a instalação desta fonte nas configurações de segurança.
          files: comanda-unica-android/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
