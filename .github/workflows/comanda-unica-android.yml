name: Portuga — Comanda Única Android
on:
  workflow_dispatch:
  push:
    paths:
      - "comanda-unica-android/**"
      - ".github/workflows/comanda-unica-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comanda-unica-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: portuga-comanda-unica-debug
          path: comanda-unica-android/android/app/build/outputs/apk/debug/app-debug.apk
