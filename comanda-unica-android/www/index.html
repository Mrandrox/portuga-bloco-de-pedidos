<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Portuga — Comanda Única</title>
<style>
:root{--bg:#0b0d10;--p:#141920;--p2:#1b222b;--l:#2b3440;--t:#f5f7fa;--m:#9ca7b5;--a:#ff7a18;--g:#35c98b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1150px;margin:auto;padding:14px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(145deg,var(--a),#ffb45e);display:grid;place-items:center;color:#180e07;font-weight:950;font-size:21px}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;color:var(--m);margin:3px 0}.status{background:#13231c;color:#72e4af;border-radius:99px;padding:8px 10px;font-size:10px;font-weight:900}.client{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:18px;padding:13px;margin-bottom:13px}.label{font-size:10px;text-transform:uppercase;color:var(--m);font-weight:900;letter-spacing:.08em;display:block;margin-bottom:6px}.clientrow{display:grid;grid-template-columns:1fr auto;gap:9px}.client input,.search{width:100%;background:#0e1217;border:1px solid var(--l);border-radius:12px;padding:12px;color:var(--t);outline:0}.client input:focus,.search:focus{border-color:var(--a)}.num{display:flex;align-items:center;background:#222a34;border:1px solid var(--l);border-radius:12px;padding:0 12px;font-size:11px;color:#dce2e8}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:#10151b;border:1px solid var(--l);border-radius:16px;position:sticky;top:5px;z-index:20;backdrop-filter:blur(14px)}.tab{background:transparent;color:var(--m);border:0;border-radius:11px;padding:11px 4px;font-weight:900;font-size:12px}.tab.active{background:var(--a);color:#170d07}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:13px;margin-top:13px}.head{display:flex;justify-content:space-between;align-items:end;margin:3px 2px 9px}.head h2{font-size:17px;margin:0}.head span{font-size:10px;color:var(--m)}.search{margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:12px;min-height:145px;display:flex;flex-direction:column}.icon{width:40px;height:40px;border-radius:12px;background:#232b35;display:grid;place-items:center;font-size:20px}.card h3{font-size:14px;margin:9px 0 4px}.card p{font-size:10px;color:var(--m);line-height:1.35;margin:0 0 8px}.price{font-size:15px;font-weight:950}.add{margin-top:auto;padding:10px;border-radius:11px;border:1px solid #35404d;background:#232c37;color:#fff;font-weight:900}.add:active{background:var(--a);color:#170d07}.order{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:13px;position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}.oh{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:10px}.oh h2{font-size:17px;margin:0}.oh small{color:var(--m);font-size:10px}.clear{background:0;color:#ff7882;border:0;font-size:10px;font-weight:900}.items{overflow:auto;min-height:120px;padding:8px 0}.empty{text-align:center;color:var(--m);padding:35px 10px;font-size:12px}.line{display:grid;grid-template-columns:1fr auto;gap:7px;padding:9px 0;border-bottom:1px solid #232b34}.ln{font-size:12px;font-weight:900}.lp{font-size:10px;color:var(--m);margin-top:3px}.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border-radius:9px;background:#252e39;color:#fff;border:0;font-weight:950}.qty b{min-width:14px;text-align:center;font-size:11px}.totals{border-top:1px solid var(--l);padding-top:9px}.row{display:flex;justify-content:space-between;color:var(--m);font-size:11px;margin:4px 0}.final{color:#fff;font-size:19px;font-weight:950;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{padding:12px;border-radius:12px;font-weight:950;border:1px solid #35404d}.secondary{background:#232c37;color:#fff}.primary{background:var(--a);color:#170d07;border-color:var(--a)}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f4f6f8;color:#111820;padding:10px 14px;border-radius:11px;font-size:11px;font-weight:900;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:13px;z-index:60}.modal.open{display:flex}.sheet{width:min(560px,100%);background:var(--p2);border:1px solid var(--l);border-radius:19px;padding:17px}.sheet h3{margin:0 0 7px}.sheet p{font-size:12px;color:var(--m);line-height:1.5}.sheet .actions{margin-top:12px}@media(max-width:820px){.layout{display:block}.order{position:fixed;left:10px;right:10px;bottom:10px;top:auto;max-height:52vh;z-index:30;box-shadow:0 18px 55px #000}.app{padding-bottom:54vh}}@media(max-width:430px){.grid{grid-template-columns:1fr}.num{display:none}.brand h1{font-size:16px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1>PORTUGA — Comanda Única</h1><p>Um cliente • uma comanda • pedido contínuo</p></div></div><div class="status">● ATIVA</div></header>
<section class="client"><span class="label">Cliente da comanda</span><div class="clientrow"><input id="client" placeholder="Digite o nome do cliente" autocomplete="off"><div class="num">COMANDA #001</div></div></section>
<nav class="tabs"><button class="tab active" data-c="lanches">🍔 Lanches</button><button class="tab" data-c="bebidas">🥤 Bebidas</button><button class="tab" data-c="petiscos">🍟 Petiscos</button><button class="tab" data-c="combos">🍱 Combos</button></nav>
<main class="layout"><section><div class="head"><h2 id="title">Lanches</h2><span id="countcat"></span></div><input id="search" class="search" placeholder="Buscar produto..."><div id="products" class="grid"></div></section>
<aside class="order"><div class="oh"><div><h2>Comanda #001</h2><small id="orderClient">Cliente não informado</small></div><button id="clear" class="clear">LIMPAR</button></div><div id="items" class="items"></div><div class="totals"><div class="row"><span>Itens</span><b id="qty">0</b></div><div class="row final"><span>Total</span><span id="total">R$ 0,00</span></div><div class="actions"><button id="save" class="btn secondary">Salvar</button><button id="finish" class="btn primary">Finalizar</button></div></div></aside></main></div>
<div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet"><h3>Comanda finalizada</h3><p id="summary"></p><div class="actions"><button id="close" class="btn secondary">Voltar</button><button id="new" class="btn primary">Nova comanda</button></div></div></div>
<script>
const C={lanches:[["X-Portuga","Pão, carne, queijo e salada",24.9,"🍔"],["X-Bacon","Carne, queijo, bacon e molho",27.9,"🥓"],["X-Salada","Carne, queijo, alface e tomate",22.9,"🥬"],["X-Frango","Frango, queijo e salada",23.9,"🍗"],["Duplo","Dois hambúrgueres e queijo",31.9,"🍔"],["Cheeseburger","Carne, queijo e molho",20.9,"🧀"]],bebidas:[["Refrigerante Lata","350 ml",6,"🥤"],["Refrigerante 600 ml","600 ml",8,"🥤"],["Suco Natural","400 ml",9,"🧃"],["Água","500 ml",4,"💧"],["Água com Gás","500 ml",5,"💧"],["Energético","473 ml",12,"⚡"]],petiscos:[["Batata Frita","Porção individual",16.9,"🍟"],["Batata Cheddar","Cheddar e bacon",22.9,"🍟"],["Calabresa Acebolada","Porção para compartilhar",25.9,"🌭"],["Frango à Passarinho","Porção crocante",29.9,"🍗"],["Isca de Frango","Tiras empanadas",27.9,"🍗"],["Anéis de Cebola","Porção crocante",19.9,"🧅"]],combos:[["Combo Portuga","Lanche + fritas + bebida",39.9,"🍱"],["Combo Bacon","Bacon + fritas + bebida",42.9,"🍱"],["Combo Duplo","Duplo + fritas + bebida",46.9,"🍱"],["Combo Família","4 lanches + 2 fritas + 4 bebidas",99.9,"👨‍👩‍👧‍👦"]]};
let cat="lanches",cart=JSON.parse(localStorage.getItem("p_comanda")||"{}");const $=x=>document.getElementById(x),M=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});function persist(){localStorage.setItem("p_comanda",JSON.stringify(cart));localStorage.setItem("p_cliente",$("client").value)}function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1600)}
function products(){let q=$("search").value.toLowerCase(),a=C[cat].filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q));$("title").textContent={lanches:"Lanches",bebidas:"Bebidas",petiscos:"Petiscos",combos:"Combos"}[cat];$("countcat").textContent=a.length+" opções";$("products").innerHTML=a.map((x,i)=>'<article class="card"><div class="icon">'+x[3]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="price">'+M(x[2])+'</div><button class="add" data-add="'+cat+':'+i+'">+ Adicionar</button></article>').join("");document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(...b.dataset.add.split(":")))}
function add(c,i){let x=C[c][+i],k=c+"|"+i;if(!cart[k])cart[k]={name:x[0],price:x[2],qty:0};cart[k].qty++;persist();order();toast(x[0]+" adicionado")}
function change(k,d){if(!cart[k])return;cart[k].qty+=d;if(cart[k].qty<1)delete cart[k];persist();order()}
function order(){let ks=Object.keys(cart),n=0,t=0;ks.forEach(k=>{n+=cart[k].qty;t+=cart[k].qty*cart[k].price});$("qty").textContent=n;$("total").textContent=M(t);$("orderClient").textContent=$("client").value.trim()||"Cliente não informado";$("items").innerHTML=ks.length?ks.map(k=>{let x=cart[k];return '<div class="line"><div><div class="ln">'+x.name+'</div><div class="lp">'+M(x.price)+' cada</div></div><div class="qty"><button data-d="'+k+'">−</button><b>'+x.qty+'</b><button data-i="'+k+'">+</button></div></div>'}).join(""):'<div class="empty">A comanda está vazia.<br>Escolha um item no cardápio.</div>';document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>change(b.dataset.i,1));document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>change(b.dataset.d,-1))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.c;products()});$("search").oninput=products;$("client").value=localStorage.getItem("p_cliente")||"";$("client").oninput=()=>{persist();order()};$("clear").onclick=()=>{cart={};persist();order();toast("Comanda limpa")};$("save").onclick=()=>{persist();toast("Comanda salva")};$("finish").onclick=()=>{let n=Object.values(cart).reduce((s,x)=>s+x.qty,0),t=Object.values(cart).reduce((s,x)=>s+x.qty*x.price,0);if(!n){toast("Adicione um item");return}$("summary").textContent=($("client").value.trim()||"Cliente não informado")+" • "+n+" item(ns) • "+M(t);$("modal").classList.add("open")};$("close").onclick=()=>$("modal").classList.remove("open");$("new").onclick=()=>{cart={};persist();$("modal").classList.remove("open");order();toast("Comanda #001 pronta para novo cliente")};products();order();
</script></body></html>
